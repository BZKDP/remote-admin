<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Admin</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a323d; --txt:#d7dee7; --accent:#3b82f6; --ok:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--txt); }
  #login { max-width:320px; margin:15vh auto; padding:24px; background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  input, button { font:inherit; }
  input[type=password], input[type=text] { width:100%; padding:10px; margin:8px 0; background:#0b0e13; border:1px solid var(--line); border-radius:8px; color:var(--txt); }
  button { padding:8px 14px; background:var(--accent); color:#fff; border:0; border-radius:8px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  #app { display:none; height:100vh; grid-template-columns:280px 1fr; }
  #side { border-right:1px solid var(--line); padding:12px; overflow:auto; background:var(--panel); }
  .agent { padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; cursor:pointer; }
  .agent:hover { border-color:var(--accent); }
  .agent.active { border-color:var(--accent); background:#1c2431; }
  .agent .h { font-weight:600; }
  .agent .m { font-size:12px; color:#8b95a3; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; }
  #main { display:flex; flex-direction:column; min-width:0; }
  #toolbar { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #stage { flex:1; display:flex; min-height:0; }
  #screenWrap { flex:1; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  canvas { max-width:100%; max-height:100%; cursor:crosshair; outline:none; }
  #term { width:38%; border-left:1px solid var(--line); display:none; flex-direction:column; background:#05070a; }
  #termOut { flex:1; overflow:auto; padding:8px; font-family:Consolas,monospace; font-size:12px; white-space:pre-wrap; }
  #termIn { border:0; border-top:1px solid var(--line); background:#05070a; color:#9ef19e; padding:8px; font-family:Consolas,monospace; }
  .badge { font-size:12px; color:#8b95a3; }
  label.sw { font-size:13px; display:flex; gap:4px; align-items:center; }
</style>
</head>
<body>

<div id="login">
  <h2>Remote Admin</h2>
  <input id="pw" type="password" placeholder="Пароль панели" autofocus>
  <button onclick="doLogin()">Войти</button>
  <div id="loginErr" style="color:#f87171;font-size:13px;margin-top:8px"></div>
</div>

<div id="app">
  <div id="side">
    <h3 style="margin-top:0">Компьютеры</h3>
    <div id="agents"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <span id="title" class="badge">Выбери компьютер слева</span>
      <span style="flex:1"></span>
      <label class="sw"><input type="checkbox" id="ctrlOn"> управление</label>
      <button class="ghost" onclick="toggleTerm()">Терминал</button>
      <button class="ghost" onclick="fitQuality()" id="qBtn">Качество: баланс</button>
    </div>
    <div id="stage">
      <div id="screenWrap">
        <canvas id="screen" tabindex="0"></canvas>
      </div>
      <div id="term">
        <div id="termOut"></div>
        <input id="termIn" placeholder="PowerShell-команда, Enter — выполнить">
      </div>
    </div>
  </div>
</div>

<script>
let token=null, ws=null, current=null;
const canvas=document.getElementById('screen'), ctx=canvas.getContext('2d');
const QUALITY=[{n:'эконом',fps:4,q:40,s:0.75},{n:'баланс',fps:6,q:55,s:1.0},{n:'чёткое',fps:10,q:75,s:1.0}];
let qi=1;

async function doLogin(){
  const pw=document.getElementById('pw').value;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  if(!r.ok){document.getElementById('loginErr').textContent='Неверный пароль';return;}
  token=(await r.json()).token;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='grid';
  connect();
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/admin?token=${token}`);
  ws.binaryType='arraybuffer';
  ws.onmessage=onMsg;
  ws.onclose=()=>setTimeout(connect,2000);
}

function onMsg(ev){
  if(typeof ev.data!=='string'){ drawFrame(ev.data); return; }
  const d=JSON.parse(ev.data);
  if(d.type==='agents') renderAgents(d.list);
  else if(d.type==='exec_out') appendTerm(d.data);
  else if(d.type==='agent_gone'){ if(current===d.id){ current=null; document.getElementById('title').textContent='Компьютер отключился'; } }
}

function renderAgents(list){
  const box=document.getElementById('agents'); box.innerHTML='';
  if(!list.length){ box.innerHTML='<div class="badge">нет онлайн-агентов</div>'; }
  list.forEach(a=>{
    const el=document.createElement('div');
    el.className='agent'+(a.id===current?' active':'');
    el.innerHTML=`<div class="h"><span class="dot"></span>${a.hostname}</div>
      <div class="m">${a.user} · ${a.os}</div><div class="m">${a.ip}${a.viewers?' · 👁'+a.viewers:''}</div>`;
    el.onclick=()=>attach(a);
    box.appendChild(el);
  });
}

function attach(a){
  current=a.id;
  ws.send(JSON.stringify({type:'attach',id:a.id}));
  document.getElementById('title').textContent=`${a.hostname} — ${a.user}`;
  startScreen();
  document.querySelectorAll('.agent').forEach(e=>e.classList.remove('active'));
}

function startScreen(){
  const q=QUALITY[qi];
  ws.send(JSON.stringify({type:'screen_start',fps:q.fps,quality:q.q,scale:q.s}));
}
function fitQuality(){ qi=(qi+1)%QUALITY.length; document.getElementById('qBtn').textContent='Качество: '+QUALITY[qi].n; startScreen(); }

let bmpBusy=false;
async function drawFrame(buf){
  if(bmpBusy) return; bmpBusy=true;
  try{
    const bmp=await createImageBitmap(new Blob([buf],{type:'image/jpeg'}));
    if(canvas.width!==bmp.width){canvas.width=bmp.width;canvas.height=bmp.height;}
    ctx.drawImage(bmp,0,0); bmp.close();
  }catch(e){}
  bmpBusy=false;
}

// ---- управление мышью/клавиатурой ----
function norm(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height};
}
function ctrl(){ return document.getElementById('ctrlOn').checked && current; }
function sendInput(o){ if(current) ws.send(JSON.stringify({type:'input',...o})); }

canvas.addEventListener('mousemove',e=>{ if(ctrl()){const p=norm(e);sendInput({action:'move',...p});}});
canvas.addEventListener('mousedown',e=>{ if(ctrl()){e.preventDefault();const p=norm(e);sendInput({action:'down',button:btn(e),...p});}});
canvas.addEventListener('mouseup',e=>{ if(ctrl()){e.preventDefault();const p=norm(e);sendInput({action:'up',button:btn(e),...p});}});
canvas.addEventListener('dblclick',e=>{ if(ctrl()){const p=norm(e);sendInput({action:'dblclick',button:btn(e),...p});}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{ if(ctrl()){e.preventDefault();sendInput({action:'scroll',dy:e.deltaY>0?-1:1});}},{passive:false});
canvas.addEventListener('keydown',e=>{ if(ctrl()){e.preventDefault();sendInput({action:'key',key:e.key,down:true});}});
canvas.addEventListener('keyup',e=>{ if(ctrl()){e.preventDefault();sendInput({action:'key',key:e.key,down:false});}});
function btn(e){ return e.button===2?'right':e.button===1?'middle':'left'; }

// ---- терминал ----
function toggleTerm(){ const t=document.getElementById('term'); t.style.display=t.style.display==='flex'?'none':'flex'; }
function appendTerm(s){ const o=document.getElementById('termOut'); o.textContent+=s; o.scrollTop=o.scrollHeight; }
document.getElementById('termIn').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&current){ const v=e.target.value; appendTerm('\n> '+v+'\n'); ws.send(JSON.stringify({type:'exec',cmd:v})); e.target.value=''; }
});
</script>
</body>
</html>
